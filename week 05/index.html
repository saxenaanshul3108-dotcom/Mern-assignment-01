<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Club</title>

    <!-- 5.3 Google Font (falls back to Georgia/serif if offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <!-- 5.1 CSS written inside the style tag -->
    <style>
      /* 5.4 All colours and spacing live here. Change them once, the whole page updates */
      :root {
        --primary: #2f5bea;      /* main blue */
        --primary-dark: #1f43b8; /* darker blue for hover */
        --page-bg: #eef2ff;      /* soft blue page background */
        --card-bg: #ffffff;      /* white cards */
        --text: #1a2238;         /* dark navy text */
        --line: #c9d0e0;         /* light grey lines */
        --radius: 14px;
        --space: 20px;
      }

      /* 5.2 Selector 1: * (everything) */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Merriweather", Georgia, serif; /* 5.3 font */
        font-size: 16px;                             /* 5.3 font size */
        line-height: 1.6;                            /* 5.3 line height */
        color: var(--text);
        background: var(--page-bg);
        max-width: 860px;
        margin: 0 auto;
        padding: var(--space);
      }

      /* 5.2 Selector 2: h1 (element) */
      h1 {
        font-size: 2.4rem;
        letter-spacing: 1px;
      }

      h2 {
        margin-bottom: var(--space);
      }

      /* 5.2 Selector 3: #hero (id) */
      #hero {
        background: var(--primary);
        color: white;
        text-align: center;
        padding: 40px var(--space);
        border-radius: var(--radius);
        margin-bottom: var(--space);
      }

      /* 5.2 Selector 4: .card (class) */
      .card {
        background: var(--card-bg);
        padding: calc(var(--space) + 4px);
        border-radius: var(--radius);
        margin-bottom: var(--space);
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: var(--primary);
        color: white;
        text-align: left;
      }

      th, td {
        padding: 12px 10px;
      }

      td {
        border-bottom: 1px solid var(--line);
      }

      /* Form */
      form p {
        margin-bottom: 10px;
      }

      input {
        padding: 6px 8px;
        border: 1px solid var(--text);
        border-radius: 3px;
        font-size: 0.9rem;
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-dark);
      }
    </style>
  </head>

  <body>
    <header id="hero">
      <h1>Coding Club</h1>
      <p>Learn. Build. Share.</p>
    </header>

    <section class="card">
      <h2>Upcoming Events</h2>
      <table>
        <thead>
          <tr>
            <th>Event</th>
            <th>Date</th>
            <th>Venue</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>HTML Workshop</td>
            <td>12 Nov</td>
            <td>Lab 1</td>
          </tr>
          <tr>
            <td>Hackathon</td>
            <td>20 Nov</td>
            <td>Seminar Hall</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="card">
      <h2>Register</h2>
      <form action="#" method="post">
        <p>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" placeholder="Your name">
        </p>
        <p>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
        </p>
        <button type="submit">Register</button>
      </form>
    </section>

    <!--
      5.5 Why I chose these colours:
      1. Blue feels trusted and techy, which suits a coding club.
      2. White cards on a soft blue background are easy on the eyes.
      3. Dark navy text on white has strong contrast, so it is easy to read.
    -->
  </body>
</html>
